<div id="downloadInfo" class="mt-3" style="display: none;">
    <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100">
        <div id="progressBar" class="progress-bar" style="width: 0"></div>
    </div>
    <div class="d-flex justify-content-between">
        <div id="speed"></div>
        <div id="downloaded"></div>
    </div>
</div>
<div id="info" class="text-start p-2 mt-2"
     style="background-color: black;color: white;width: 100%;height: 260px;border-radius: 6px;overflow-y: auto;white-space: pre-wrap;">
</div>
<div class="d-flex justify-content-between mt-3">
    <div id="step"></div>
    <div>
        <button id="btnPrev" class="btn btn-primary">上一步</button>
        <button id="btnInstall" class="btn btn-primary" onclick="onInstallClick()">安装</button>
        <button id="btnNext" class="btn btn-primary" disabled>下一步</button>
        <button id="btnSkip" class="btn btn-primary">跳过</button>
    </div>
</div>
<script>

    /**
     * 当前页面的工具信息,在页面的 #toolInstall 元素上通过data属性设置
     */
    const tool = $("#toolInstall").data()

    /**
     * 安装进度的WebSocket连接,避免重复创建
     */
    let progressWebsocket = null

    $(function () {
        $("#step").text(tool.step)
        if (tool.prev) {
            $("#btnPrev").on("click", () => location.href = tool.prev)
        } else {
            $("#btnPrev").hide()
        }
        $("#btnNext").on("click", () => location.href = tool.next)

        //工具不是必须的,没有安装时只影响对应格式文件的处理
        $("#btnSkip").on("click", () => location.href = tool.next)
        $.ajaxByData(`/api/install/tool/${tool.name}`).success(data => {
            updateProgress(data)
            if (data.isRunning) {
                showProgress()
            }
        }).get()
    })

    /**
     * 安装按钮点击事件
     */
    function onInstallClick() {
        $.ajaxByData(`/api/install/tool/${tool.name}/install`).success(showProgress).post()
    }

    /**
     * 通过WebSocket显示安装进度
     */
    function showProgress() {
        if (progressWebsocket != null) {
            progressWebsocket.close()
        }
        const protocol = location.protocol === "https:" ? "wss:" : "ws:"
        progressWebsocket = new WebSocket(`${protocol}//${location.host}/api/install/tool/${tool.name}/progress`)
        progressWebsocket.onmessage = event => updateProgress(JSON.parse(event.data))
    }

    /**
     * 更新安装进度
     */
    function updateProgress(data) {
        $("#info").text(data.info)
        if (data.isInstalled) {//已经安装完成
            $("#downloadInfo").hide()
            $("#btnNext").removeAttr("disabled")
            $("#btnInstall").hide()
            $("#btnSkip").hide()
            return
        }
        $("#btnInstall").prop("disabled", data.isRunning)
        if (!data.isRunning || data.total === "0 Byte") {//没有在下载
            $("#downloadInfo").hide()
            return
        }
        $("#downloadInfo").show()
        $("#progressBar").text(data.progress + "%").css("width", data.progress + "%")
        $("#speed").text(data.speed)
        $("#downloaded").text(`${data.downloadedSize}/${data.total}`)
    }
</script>
