<!DOCTYPE html>
<html lang="zh-CN">
<head>
    {{template /include/head}}
    <title>设置存储目录</title>
</head>
<body class="bg-login">
<div class="text-center d-table" style="width: 100vw;height: 100vh;">
    <div class="d-table-cell align-middle" style="padding: 0 100px">
        <div class="d-inline-block border rounded bg-white p-3" style="max-width: 700px;width: 100%;">
            <span class="fs-4">设置存储目录</span>
            <form action="/api/install/set_storage">
                <div id="pathDiv">
                    <input class="form-control mt-3" type="text" placeholder="目录" autocomplete="off">
                </div>
                <input type="hidden" name="folders">
                <div class="text-end mt-2">
                    <i class="bi bi-plus-circle" style="font-size: 26px" role="button" onclick="onAddClick()"></i>
                </div>
                <div class="d-flex justify-content-between mt-5">
                    <div>
                        6/8
                    </div>
                    <div>
                        <button type="button" class="btn btn-primary"
                                onclick="window.location.href='exiftool.html'">上一步
                        </button>
                        <button type="button" class="btn btn-primary" onclick="onSetClick()">设置</button>
                        <button type="button" class="btn btn-primary"
                                onclick="window.location.href='distributed.html'">跳过
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
<script>
    $(function () {
        $.ajaxByData("/api/install/info").success(data => {
            const folders = data.folders.split("\n").filter(it => it !== "")
            folders.forEach((it, i) => {
                if (i > 0) {
                    onAddClick()
                }
                $("#pathDiv>input").eq(i).val(it)
            })
        }).get()
    })

    /**
     * 添加一个目录输入框点击事件
     */
    function onAddClick() {
        $("#pathDiv").append('<input class="form-control mt-3" type="text" placeholder="目录" autocomplete="off">')
    }

    /**
     * 设置按钮点击事件
     */
    function onSetClick() {
        const folders = $("#pathDiv>input").map((_, it) => it.value.trim()).get().filter(it => it !== "")
        $("input[name='folders']").val(folders.join("\n"))
        $("form").ajaxByForm().success(() => {
            window.location.href = "distributed.html"
        }).post()
    }
</script>
</body>
</html>
